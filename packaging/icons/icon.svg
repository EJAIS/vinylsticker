<?xml version="1.0" encoding="UTF-8"?>
<!--
  Vinyl Label Printer - master app icon: a stylised 7" single with the large
  45 rpm centre hole. Rendered to .ico/.png by build_icons.py.
  Elements with class="detail" are left out at small sizes (see build_icons.py).
-->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <radialGradient id="disc" cx="128" cy="128" r="124" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2c2c33"/>
      <stop offset="1" stop-color="#15151a"/>
    </radialGradient>
    <linearGradient id="label" x1="88" y1="88" x2="168" y2="168"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f4733f"/>
      <stop offset="1" stop-color="#d9402a"/>
    </linearGradient>
  </defs>

  <!-- Disc with centre hole (even-odd keeps the hole transparent) -->
  <path fill="url(#disc)" fill-rule="evenodd"
        d="M4,128 a124,124 0 1,0 248,0 a124,124 0 1,0 -248,0 Z
           M101,128 a27,27 0 1,0 54,0 a27,27 0 1,0 -54,0 Z"/>

  <!-- Light rim so the disc stays visible on dark backgrounds -->
  <circle cx="128" cy="128" r="120" fill="none" stroke="#6b6b79" stroke-width="8"/>

  <!-- Grooves -->
  <g class="detail" fill="none" stroke="#3d3d47" stroke-width="2.5">
    <circle cx="128" cy="128" r="108"/>
    <circle cx="128" cy="128" r="96"/>
    <circle cx="128" cy="128" r="84"/>
  </g>

  <!-- Sheen -->
  <g fill="#ffffff" fill-opacity="0.10">
    <path d="M158.54,14.02 A118,118 0 0,1 224.66,60.32 L183.7,89 A68,68 0 0,0 145.6,62.32 Z"/>
    <path d="M97.46,241.98 A118,118 0 0,1 31.34,195.68 L72.3,167 A68,68 0 0,0 110.4,193.68 Z"/>
  </g>

  <!-- Centre label -->
  <path fill="url(#label)" fill-rule="evenodd"
        d="M66,128 a62,62 0 1,0 124,0 a62,62 0 1,0 -124,0 Z
           M101,128 a27,27 0 1,0 54,0 a27,27 0 1,0 -54,0 Z"/>
  <circle class="detail" cx="128" cy="128" r="45" fill="none"
          stroke="#ffffff" stroke-opacity="0.35" stroke-width="3"/>
</svg>
