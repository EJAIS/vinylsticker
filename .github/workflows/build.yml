name: Build

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_dry_run:
        description: >-
          Release dry run: prepare the release (artifacts, SHA256SUMS, file list) but
          do not create it, even when run on a v* tag.
        type: boolean
        default: false
      dry_run_tag:
        description: >-
          Optional, implies a dry run: build as if for this tag (e.g. v1.0.0-rc.1) to
          check the package version and file names of a release before tagging it.
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  SPEC_FILE: packaging/vinyl-label-printer.spec
  # Pinned Poppler build for Windows (https://github.com/oschwartz10612/poppler-windows)
  POPPLER_VERSION: "26.09.0-0"
  POPPLER_SHA256: "7a6f256a0ddf7536182246a5733331bf4677cbcc34f4663774947ad34556c8d0"
  # Pinned fpm (https://rubygems.org/gems/fpm) for the .deb package
  FPM_VERSION: "1.17.0"
  # Inno Setup installed via Chocolatey if the runner image has none
  INNOSETUP_VERSION: "6.5.4"

jobs:
  version:
    # Computes the versions once for all builds (packaging/package_version.sh)
    # and fails fast, before anything is built, on a tag that does not match
    # __version__.py.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      # X.Y.Z from __version__.py (app --version, Windows VersionInfoVersion)
      version: ${{ steps.version.outputs.version }}
      # X.Y.Z or X.Y.Z-<suffix> (file names, AppVersion)
      package_version: ${{ steps.version.outputs.package_version }}
      # X.Y.Z or X.Y.Z~<suffix> (Debian version, sorts before X.Y.Z)
      deb_version: ${{ steps.version.outputs.deb_version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      release_tag: ${{ steps.version.outputs.release_tag }}
      # "false" only for a v* tag without a dry run requested
      dry_run: ${{ steps.version.outputs.dry_run }}
    steps:
      - uses: actions/checkout@v5

      - name: Test the version mapping
        run: packaging/test_package_version.sh

      - name: Compute the package version
        id: version
        env:
          RELEASE_DRY_RUN: ${{ inputs.release_dry_run }}
          DRY_RUN_TAG: ${{ inputs.dry_run_tag }}
        run: |
          ref="$GITHUB_REF"
          if [ -n "$DRY_RUN_TAG" ]; then
            if [[ "$DRY_RUN_TAG" != v* ]]; then
              echo "::error::dry_run_tag must be a v* tag, e.g. v1.0.0-rc.1"
              exit 1
            fi
            ref="refs/tags/$DRY_RUN_TAG"
          fi
          version=$(python3 -c "import runpy; print(runpy.run_path('vinyl-label-printer/__version__.py')['__version__'])")
          result=$(packaging/package_version.sh "$version" "$ref")
          echo "$result" >> "$GITHUB_OUTPUT"

          # Only a real v* tag publishes a release.
          dry_run=true
          if [[ "$GITHUB_REF" == refs/tags/v* && -z "$DRY_RUN_TAG" \
                && "$RELEASE_DRY_RUN" != true ]]; then
            dry_run=false
          fi
          echo "dry_run=$dry_run" >> "$GITHUB_OUTPUT"
          echo "Ref: $ref"
          echo "$result"
          echo "dry_run=$dry_run"

          deb_version=$(sed -n 's/^deb_version=//p' <<<"$result")
          if [ "$deb_version" != "$version" ]; then
            # A pre-release must sort before its final release, or apt would
            # treat the final X.Y.Z as already installed.
            dpkg --compare-versions "$deb_version" lt "$version"
            echo "dpkg: $deb_version < $version"
          fi

  windows:
    needs: version
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      VERSION: ${{ needs.version.outputs.version }}
      PACKAGE_VERSION: ${{ needs.version.outputs.package_version }}
      SETUP_ARTIFACT: vinyl-label-printer-${{ needs.version.outputs.package_version }}-setup
    outputs:
      setup_file: ${{ steps.setup.outputs.file }}
      setup_artifact: ${{ env.SETUP_ARTIFACT }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: vinyl-label-printer/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r vinyl-label-printer/requirements.txt pyinstaller

      - name: Download Poppler ${{ env.POPPLER_VERSION }}
        run: |
          $url = "https://github.com/oschwartz10612/poppler-windows/releases/download/v$env:POPPLER_VERSION/Release-$env:POPPLER_VERSION.zip"
          $zip = Join-Path $env:RUNNER_TEMP "poppler.zip"
          $tmp = Join-Path $env:RUNNER_TEMP "poppler"
          Invoke-WebRequest -Uri $url -OutFile $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:POPPLER_SHA256) { throw "Poppler checksum mismatch: $hash" }
          Expand-Archive -Path $zip -DestinationPath $tmp
          $root = Get-ChildItem $tmp -Directory | Select-Object -First 1
          New-Item -ItemType Directory -Force -Path packaging/poppler | Out-Null
          Copy-Item -Recurse (Join-Path $root.FullName "Library/bin") packaging/poppler/bin
          # License files of the bundled Poppler data (GPL / Adobe)
          Copy-Item (Join-Path $root.FullName "share/poppler/COPYING*") packaging/poppler/
          if (-not (Test-Path packaging/poppler/bin/pdftoppm.exe)) { throw "pdftoppm.exe missing" }
          if (-not (Test-Path packaging/poppler/bin/pdfinfo.exe)) { throw "pdfinfo.exe missing" }

      - name: Build with PyInstaller
        run: pyinstaller --noconfirm --clean $env:SPEC_FILE

      - name: Smoke test (--version)
        run: |
          $exe = "dist/vinyl-label-printer/vinyl-label-printer.exe"
          $out = Join-Path $env:RUNNER_TEMP "version.txt"
          # Windowed exe: start it explicitly and wait, with a timeout so a
          # blocking error dialog cannot hang the job.
          $p = Start-Process -FilePath $exe -ArgumentList "--version" -NoNewWindow `
            -RedirectStandardOutput $out -PassThru
          $null = $p.Handle  # needed so ExitCode is available after exit
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw "Smoke test timed out" }
          $text = (Get-Content $out -Raw)
          Write-Host "Output: $text"
          if ($p.ExitCode -ne 0) { throw "Exit code $($p.ExitCode)" }
          if ($text -notmatch [regex]::Escape($env:VERSION)) {
            throw "Version string not found in output"
          }
          if (-not (Test-Path "dist/vinyl-label-printer/_internal/poppler/bin/pdftoppm.exe")) {
            throw "Poppler not bundled"
          }

      - name: Verify app icon
        run: |
          python packaging/icons/check_exe_icon.py dist/vinyl-label-printer/vinyl-label-printer.exe
          if ($LASTEXITCODE -ne 0) { throw "App icon check failed" }
          if (-not (Test-Path "dist/vinyl-label-printer/_internal/icons/vinyl-label-printer.png")) {
            throw "Window icon PNG not bundled"
          }

      - uses: actions/upload-artifact@v7
        with:
          name: vinyl-label-printer-${{ env.PACKAGE_VERSION }}-windows
          path: dist/vinyl-label-printer
          if-no-files-found: error

      - name: Build installer (Inno Setup)
        id: setup
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (Test-Path $iscc) {
            Write-Host "Using preinstalled Inno Setup"
          } else {
            choco install innosetup --version $env:INNOSETUP_VERSION -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw "choco install innosetup failed" }
          }
          Remove-Item dist/VinylLabelPrinterSetup-*.exe -ErrorAction SilentlyContinue
          # Not quiet: the log shows "Compiler engine version" (ISCC.exe itself
          # carries no version resource) and every file packed into the setup.
          # AppVersion may carry a pre-release suffix; the version resource
          # (VersionInfoVersion) must be numeric.
          & $iscc "/DAppVersion=$env:PACKAGE_VERSION" "/DNumericVersion=$env:VERSION" `
            packaging/windows/vinyl-label-printer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }
          # Report the file ISCC actually wrote; later steps and jobs use this name.
          $built = @(Get-ChildItem dist -Filter "VinylLabelPrinterSetup-*.exe")
          if ($built.Count -ne 1) { throw "Expected one setup in dist, found $($built.Count)" }
          $file = $built[0].Name
          Write-Host "Built dist/$file"
          "file=$file" >> $env:GITHUB_OUTPUT

      - name: Install test (silent install, upgrade, --version, uninstall, foreign folder)
        run: |
          $setup = (Resolve-Path "dist/${{ steps.setup.outputs.file }}").Path
          $appDir = Join-Path $env:LOCALAPPDATA "Programs\Vinyl Label Printer"
          $exe = Join-Path $appDir "vinyl-label-printer.exe"
          $shortcut = Join-Path $env:APPDATA `
            "Microsoft\Windows\Start Menu\Programs\Vinyl Label Printer\Vinyl Label Printer.lnk"
          $uninstKey = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\" +
            "{BFCF8A94-71A8-4613-99F2-B65DB1EA679E}_is1"
          $dataFile = Join-Path $env:APPDATA "vinyl-label-printer\settings.json"

          # Runs a process with a timeout so a hanging dialog cannot block the job.
          function Invoke-WithTimeout($file, $arguments, $seconds, $log) {
            $p = Start-Process -FilePath $file -ArgumentList $arguments -PassThru
            $null = $p.Handle  # needed so ExitCode is available after exit
            if (-not $p.WaitForExit($seconds * 1000)) {
              $p.Kill(); throw "$file timed out after $seconds s"
            }
            if ($p.ExitCode -ne 0) {
              if ($log -and (Test-Path $log)) { Get-Content $log -Tail 40 }
              throw "$file exited with code $($p.ExitCode)"
            }
          }
          $silent = @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/CURRENTUSER", "/NORESTART")

          # Waits for an uninstaller: it restarts itself from %TEMP% and
          # returns at once.
          function Wait-Gone($path, $seconds) {
            $deadline = (Get-Date).AddSeconds($seconds)
            while ((Test-Path $path) -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 2 }
          }

          # Fresh install, then the same setup again over it (upgrade path:
          # same AppId, files replaced, still one uninstall entry). A stale file
          # in _internal stands for a library of the old version: the upgrade
          # must remove it ([InstallDelete]).
          $stale = Join-Path $appDir "_internal\stale-from-old-version.txt"
          foreach ($run in 1, 2) {
            $log = Join-Path $env:RUNNER_TEMP "setup-$run.log"
            Invoke-WithTimeout $setup ($silent + "/LOG=`"$log`"") 300 $log
            Write-Host "Install run $run finished"
            if ($run -eq 1) { Set-Content -Path $stale -Value "stale" }
          }
          if (Test-Path $stale) { throw "Upgrade did not remove the old _internal: $stale" }
          if (-not (Test-Path $exe)) { throw "Installed exe not found: $exe" }
          if (-not (Test-Path $shortcut)) { throw "Start Menu shortcut not found: $shortcut" }
          if (Test-Path (Join-Path $appDir "unins001.exe")) { throw "Second uninstaller: upgrade created a new installation" }
          $entry = Get-ItemProperty $uninstKey
          Write-Host "Uninstall entry: $($entry.DisplayName) $($entry.DisplayVersion)"
          if ($entry.DisplayVersion -ne $env:PACKAGE_VERSION) { throw "Unexpected DisplayVersion" }

          # --version of the installed exe (same method as the smoke test)
          $out = Join-Path $env:RUNNER_TEMP "installed-version.txt"
          $p = Start-Process -FilePath $exe -ArgumentList "--version" -NoNewWindow `
            -RedirectStandardOutput $out -PassThru
          $null = $p.Handle
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw "--version timed out" }
          $text = (Get-Content $out -Raw)
          Write-Host "Output: $text"
          if ($p.ExitCode -ne 0) { throw "Exit code $($p.ExitCode)" }
          if ($text -notmatch [regex]::Escape($env:VERSION)) { throw "Version string not found" }

          # User data must survive the uninstall.
          New-Item -ItemType Directory -Force -Path (Split-Path $dataFile) | Out-Null
          Set-Content -Path $dataFile -Value "{}"

          $log = Join-Path $env:RUNNER_TEMP "uninstall.log"
          Invoke-WithTimeout (Join-Path $appDir "unins000.exe") `
            @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/LOG=`"$log`"") 120 $log
          Wait-Gone $appDir 120
          if (Test-Path $appDir) {
            Get-ChildItem -Recurse $appDir | Select-Object -First 20 | ForEach-Object { $_.FullName }
            throw "Program folder still exists after uninstall: $appDir"
          }
          if (Test-Path $shortcut) { throw "Start Menu shortcut still exists after uninstall" }
          if (Test-Path $uninstKey) { throw "Uninstall entry still exists after uninstall" }
          if (-not (Test-Path $dataFile)) { throw "User data was deleted by the uninstaller" }
          Write-Host "Uninstall OK: program folder, shortcut and uninstall entry removed, user data kept"

          # Install into a folder that holds another app's _internal (no
          # vinyl-label-printer.exe): its files must survive install and uninstall.
          $otherDir = Join-Path $env:RUNNER_TEMP "Other App"
          $keep = Join-Path $otherDir "_internal\keep.txt"
          New-Item -ItemType Directory -Force -Path (Split-Path $keep) | Out-Null
          Set-Content -Path $keep -Value "not ours"
          $log = Join-Path $env:RUNNER_TEMP "setup-other.log"
          Invoke-WithTimeout $setup ($silent + "/DIR=`"$otherDir`"" + "/LOG=`"$log`"") 300 $log
          $otherExe = Join-Path $otherDir "vinyl-label-printer.exe"
          if (-not (Test-Path $otherExe)) { throw "Installed exe not found: $otherExe" }
          if (-not (Test-Path $keep)) { throw "Install deleted the foreign _internal: $keep" }

          $log = Join-Path $env:RUNNER_TEMP "uninstall-other.log"
          Invoke-WithTimeout (Join-Path $otherDir "unins000.exe") `
            @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/LOG=`"$log`"") 120 $log
          Wait-Gone $otherExe 120
          Wait-Gone (Join-Path $otherDir "unins000.exe") 60
          if (Test-Path $otherExe) { throw "Exe still exists after uninstall: $otherExe" }
          if (-not (Test-Path $keep)) { throw "Uninstall deleted the foreign _internal: $keep" }
          Write-Host "Foreign folder OK: _internal\keep.txt kept through install and uninstall"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.SETUP_ARTIFACT }}
          path: dist/${{ steps.setup.outputs.file }}
          if-no-files-found: error

  linux:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Build on Ubuntu 22.04 so the bundle links against glibc 2.35 and runs on
    # Linux Mint 21 (22.04 base) and 22 (24.04 base).
    container: ubuntu:22.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
      PACKAGE_VERSION: ${{ needs.version.outputs.package_version }}
      DEB_VERSION: ${{ needs.version.outputs.deb_version }}
      DEB_ARTIFACT: vinyl-label-printer-${{ needs.version.outputs.package_version }}-deb
    outputs:
      deb_file: ${{ steps.deb.outputs.file }}
      deb_artifact: ${{ env.DEB_ARTIFACT }}
    steps:
      - name: Install system packages
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          # binutils: objdump for PyInstaller's dependency analysis.
          # libpython3.10: shared Python library that PyInstaller bundles.
          # Qt runtime libraries: needed for the --version smoke test and so
          # PyInstaller can resolve (and bundle) the xcb/wayland dependencies of
          # the Qt platform plugins. libGL/libEGL are taken from the target system.
          apt-get install -y --no-install-recommends \
            ca-certificates git binutils \
            python3 python3-pip python3-venv libpython3.10 \
            libegl1 libgl1 libopengl0 libglib2.0-0 libfontconfig1 libfreetype6 libdbus-1-3 \
            libxkbcommon0 libxkbcommon-x11-0 libx11-xcb1 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1 \
            libxcb-util1 libwayland-client0 libwayland-cursor0 libwayland-egl1

      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          python3 -m venv /opt/venv
          /opt/venv/bin/pip install --upgrade pip
          /opt/venv/bin/pip install -r vinyl-label-printer/requirements.txt pyinstaller

      - name: Build with PyInstaller
        run: /opt/venv/bin/pyinstaller --noconfirm --clean "$SPEC_FILE"

      - name: Smoke test (--version)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          out=$(dist/vinyl-label-printer/vinyl-label-printer --version)
          echo "Output: $out"
          echo "$out" | grep -F "$VERSION"
          test -f dist/vinyl-label-printer/_internal/icons/vinyl-label-printer.png
          # The committed window icon is the 256 px hicolor PNG (build_icons.py).
          cmp vinyl-label-printer/icons/vinyl-label-printer.png \
            packaging/icons/hicolor/256x256/apps/vinyl-label-printer.png

      - name: Install fpm ${{ env.FPM_VERSION }}
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get install -y --no-install-recommends ruby
          gem install --no-document fpm -v "$FPM_VERSION"
          fpm --version

      - name: Build .deb
        id: deb
        # Uses PACKAGE_VERSION / DEB_VERSION and writes file=<name> to GITHUB_OUTPUT.
        run: PYTHON=/opt/venv/bin/python packaging/linux/build_deb.sh dist

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.DEB_ARTIFACT }}
          path: dist/${{ steps.deb.outputs.file }}
          if-no-files-found: error

      - name: Create tarball
        id: tarball
        run: |
          name="vinyl-label-printer-$PACKAGE_VERSION-linux-x86_64"
          tar -czf "$name.tar.gz" -C dist vinyl-label-printer
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.tarball.outputs.name }}
          path: ${{ steps.tarball.outputs.name }}.tar.gz
          if-no-files-found: error

  deb-install-test:
    needs: [version, linux]
    name: deb-install-test (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Linux Mint 21 is based on Ubuntu 22.04, Linux Mint 22 on Ubuntu 24.04.
        image: ["ubuntu:22.04", "ubuntu:24.04"]
    # Fresh container: nothing but the .deb and its Depends gets installed
    # before the checks below.
    container: ${{ matrix.image }}
    env:
      DEBIAN_FRONTEND: noninteractive
      DEB_FILE: ${{ needs.linux.outputs.deb_file }}
      VERSION: ${{ needs.version.outputs.version }}
      DEB_VERSION: ${{ needs.version.outputs.deb_version }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.linux.outputs.deb_artifact }}

      - name: Install the .deb
        run: |
          apt-get update
          # Without Recommends, so only the package's Depends can satisfy the
          # bundle's libraries.
          apt-get install -y --no-install-recommends "./$DEB_FILE"
          installed=$(dpkg-query -W -f='${Version}' vinyl-label-printer)
          echo "Installed Debian version: $installed"
          test "$installed" = "$DEB_VERSION"

      - name: Run --version from /usr/bin
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          test "$(command -v vinyl-label-printer)" = /usr/bin/vinyl-label-printer
          out=$(vinyl-label-printer --version)
          echo "Output: $out"
          echo "$out" | grep -F "$VERSION"

      - name: Check the environment of child processes
        # Regression test: the bootloader points LD_LIBRARY_PATH at the bundle and
        # the PyQt6 runtime hook sets QT_PLUGIN_PATH. Programs started by the app
        # (xdg-open, file manager, browser, PDF viewer, pdftoppm / pdfinfo) must not
        # inherit them, or they load the bundle's libraries and crash.
        # --print-child-env prints the app's os.environ after the restore, which is
        # what subprocess, QProcess, QDesktopServices and pdf2image pass on, and
        # then runs the PDF preview's Poppler call through pdf2image.
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          # Not exported: the app would inherit it and report it.
          bundle=/opt/vinyl-label-printer
          fail_if_found() {   # pattern file what
            if grep -E "$1" "$2"; then
              echo "::error::$3"
              exit 1
            fi
          }

          # Started without LD_LIBRARY_PATH, as from the menu entry.
          env -u LD_LIBRARY_PATH vinyl-label-printer --print-child-env > child-env.txt
          cat child-env.txt
          fail_if_found "$bundle" child-env.txt "A bundle path reaches child processes"
          fail_if_found '^(LD_LIBRARY_PATH|LD_LIBRARY_PATH_ORIG|QT_PLUGIN_PATH|QML2_IMPORT_PATH|_PYI_[A-Z_]*)=' \
            child-env.txt "A variable set for the bundle reaches child processes"
          grep -qx '# pdf2image: OK (1 page)' child-env.txt

          # pdftoppm with exactly this environment resolves only system libraries.
          mapfile -t child_env < <(grep -v '^# ' child-env.txt)
          env -i "${child_env[@]}" ldd "$(command -v pdftoppm)" > ldd.txt
          cat ldd.txt
          fail_if_found "$bundle|not found" ldd.txt "pdftoppm does not use the system libraries"
          env -i "${child_env[@]}" pdftoppm -v

          # A user's own LD_LIBRARY_PATH is passed on unchanged.
          LD_LIBRARY_PATH=/usr/local/lib/user-test vinyl-label-printer --print-child-env \
            > child-env-user.txt
          fail_if_found "$bundle" child-env-user.txt "A bundle path reaches child processes"
          grep -x 'LD_LIBRARY_PATH=/usr/local/lib/user-test' child-env-user.txt

      - name: Check that all bundled libraries resolve
        run: packaging/linux/check_bundle_libs.sh /opt/vinyl-label-printer

      - name: Validate the .desktop file
        run: |
          apt-get install -y --no-install-recommends desktop-file-utils
          desktop-file-validate /usr/share/applications/vinyl-label-printer.desktop

      - name: Start from the menu entry on X11 (Xvfb) and check the window matching
        env:
          DESKTOP_FILE: /usr/share/applications/vinyl-label-printer.desktop
        run: |
          apt-get install -y --no-install-recommends \
            xvfb x11-utils libgl1-mesa-dri fonts-dejavu-core
          # Absolute paths, so a launcher left in ~/.local/bin by an old script
          # install (first in PATH on Linux Mint) cannot be started instead.
          exec_cmd=$(sed -n 's/^Exec=//p' "$DESKTOP_FILE")
          test "$exec_cmd" = /usr/bin/vinyl-label-printer
          test "$(sed -n 's/^TryExec=//p' "$DESKTOP_FILE")" = /usr/bin/vinyl-label-printer
          expected_class=$(sed -n 's/^StartupWMClass=//p' "$DESKTOP_FILE")
          desktop_id=$(basename "$DESKTOP_FILE" .desktop)
          Xvfb :99 -screen 0 1400x1000x24 & xvfb=$!
          export DISPLAY=:99
          for _ in $(seq 1 20); do xdpyinfo >/dev/null 2>&1 && break; sleep 0.5; done
          QT_QPA_PLATFORM=xcb "$exec_cmd" & app=$!
          # The main window title is "<app name> v<version>" in every language.
          for _ in $(seq 1 60); do
            id=$(xwininfo -root -tree \
              | awk -v t=" v$VERSION\"" 'index($0, t) && !id {id = $1} END {print id}')
            [ -n "$id" ] && break
            kill -0 "$app"   # fails the step if the app has exited
            sleep 1
          done
          test -n "$id"
          # Window icon set from icons/vinyl-label-printer.png (256 px). The
          # custom xprop format prints no trailing newline, hence the echo.
          # shellcheck disable=SC2016  # xprop format, not shell variables
          xprop -id "$id" -len 16 -f _NET_WM_ICON 32cc ' = $0 x $1' _NET_WM_ICON | tee icon.txt
          echo
          grep -qF "= 256 x 256" icon.txt
          # WM_CLASS(STRING) = "<instance>", "<class>"; StartupWMClass is the class.
          xprop -id "$id" WM_CLASS | tee wm_class.txt
          test "$(awk -F'"' '{print $4}' wm_class.txt)" = "$expected_class"
          # setDesktopFileName() in main.py: Qt sets _GTK_APPLICATION_ID (and the
          # Wayland app_id) to it; it must name this .desktop file.
          xprop -id "$id" _GTK_APPLICATION_ID | tee app_id.txt
          test "$(awk -F'"' '{print $2}' app_id.txt)" = "$desktop_id"
          kill "$app" "$xvfb"

      - name: Remove the package (user data is kept)
        run: |
          mkdir -p "$HOME/.config/vinyl-label-printer"
          echo '{}' > "$HOME/.config/vinyl-label-printer/settings.json"
          apt-get remove -y vinyl-label-printer
          test ! -e /usr/bin/vinyl-label-printer
          test ! -e /opt/vinyl-label-printer
          test -f "$HOME/.config/vinyl-label-printer/settings.json"

  release:
    # Runs for every build. On a v* tag it publishes the GitHub Release. Pull
    # requests, pushes to main and workflow_dispatch runs with release_dry_run or
    # dry_run_tag run it as a dry run: the same downloads, SHA256SUMS and file
    # list, but no release is created. So a broken release job shows up before
    # the first real tag.
    needs: [version, windows, linux, deb-install-test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The only job that may write: creating the release and uploading its assets
    # (skipped in a dry run).
    permissions:
      contents: write
    env:
      DRY_RUN: ${{ needs.version.outputs.dry_run }}
      TAG: ${{ needs.version.outputs.release_tag }}
      PRERELEASE: ${{ needs.version.outputs.prerelease }}
      # File names as reported by the builds; nothing below builds one itself.
      DEB_FILE: ${{ needs.linux.outputs.deb_file }}
      SETUP_FILE: ${{ needs.windows.outputs.setup_file }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.linux.outputs.deb_artifact }}
          path: release

      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.windows.outputs.setup_artifact }}
          path: release

      - name: Create SHA256SUMS.txt
        working-directory: release
        run: |
          sha256sum "$DEB_FILE" "$SETUP_FILE" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: List the release files
        id: files
        run: |
          files=("release/$DEB_FILE" "release/$SETUP_FILE" release/SHA256SUMS.txt)
          for f in "${files[@]}"; do
            if [ ! -f "$f" ]; then
              echo "::error::$f not found"
              exit 1
            fi
            # GitHub renames release assets with special characters (e.g. "~").
            if [[ ! "$(basename "$f")" =~ ^[A-Za-z0-9._-]+$ ]]; then
              echo "::error::$f: asset names may only contain letters, digits, '.', '_' and '-'"
              exit 1
            fi
          done
          {
            echo "files<<EOF_FILES"
            printf '%s\n' "${files[@]}"
            echo "EOF_FILES"
          } >> "$GITHUB_OUTPUT"

          if [ "$DRY_RUN" = false ]; then
            echo "Creating or updating the release for $TAG with:"
          else
            echo "Dry run, no release is created. A release for tag ${TAG:-<none>}" \
              "(prerelease: $PRERELEASE) would get:"
          fi
          ls -l "${files[@]}"
          {
            if [ "$DRY_RUN" = false ]; then
              echo "### Release $TAG"
            else
              echo "### Release dry run (tag: ${TAG:-none}, no release created)"
            fi
            echo
            echo "Pre-release: $PRERELEASE"
            echo
            echo "| File | Size (bytes) | SHA-256 |"
            echo "|---|---:|---|"
            for f in "${files[@]}"; do
              echo "| $(basename "$f") | $(stat -c %s "$f") | \`$(sha256sum "$f" | cut -d' ' -f1)\` |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create or update the GitHub Release
        if: env.DRY_RUN == 'false'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.TAG }}
          name: Vinyl Label Printer ${{ env.TAG }}
          # Tags with a suffix (v1.0.0-rc.1) become pre-releases. The in-app
          # update check (modules/version_checker.py) only accepts plain vX.Y.Z
          # tags, so a pre-release is never offered as an update. Keep it that way.
          prerelease: ${{ env.PRERELEASE == 'true' }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: ${{ steps.files.outputs.files }}
