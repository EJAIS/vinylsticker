name: Build

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  SPEC_FILE: packaging/vinyl-label-printer.spec
  # Pinned Poppler build for Windows (https://github.com/oschwartz10612/poppler-windows)
  POPPLER_VERSION: "26.09.0-0"
  POPPLER_SHA256: "7a6f256a0ddf7536182246a5733331bf4677cbcc34f4663774947ad34556c8d0"
  # Pinned fpm (https://rubygems.org/gems/fpm) for the .deb package
  FPM_VERSION: "1.17.0"
  # Inno Setup installed via Chocolatey if the runner image has none
  INNOSETUP_VERSION: "6.5.4"

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: vinyl-label-printer/requirements.txt

      - name: Read version
        id: version
        run: |
          $version = python -c "import runpy; print(runpy.run_path('vinyl-label-printer/__version__.py')['__version__'])"
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $version"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r vinyl-label-printer/requirements.txt pyinstaller

      - name: Download Poppler ${{ env.POPPLER_VERSION }}
        run: |
          $url = "https://github.com/oschwartz10612/poppler-windows/releases/download/v$env:POPPLER_VERSION/Release-$env:POPPLER_VERSION.zip"
          $zip = Join-Path $env:RUNNER_TEMP "poppler.zip"
          $tmp = Join-Path $env:RUNNER_TEMP "poppler"
          Invoke-WebRequest -Uri $url -OutFile $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:POPPLER_SHA256) { throw "Poppler checksum mismatch: $hash" }
          Expand-Archive -Path $zip -DestinationPath $tmp
          $root = Get-ChildItem $tmp -Directory | Select-Object -First 1
          New-Item -ItemType Directory -Force -Path packaging/poppler | Out-Null
          Copy-Item -Recurse (Join-Path $root.FullName "Library/bin") packaging/poppler/bin
          # License files of the bundled Poppler data (GPL / Adobe)
          Copy-Item (Join-Path $root.FullName "share/poppler/COPYING*") packaging/poppler/
          if (-not (Test-Path packaging/poppler/bin/pdftoppm.exe)) { throw "pdftoppm.exe missing" }
          if (-not (Test-Path packaging/poppler/bin/pdfinfo.exe)) { throw "pdfinfo.exe missing" }

      - name: Build with PyInstaller
        run: pyinstaller --noconfirm --clean $env:SPEC_FILE

      - name: Smoke test (--version)
        run: |
          $exe = "dist/vinyl-label-printer/vinyl-label-printer.exe"
          $out = Join-Path $env:RUNNER_TEMP "version.txt"
          # Windowed exe: start it explicitly and wait, with a timeout so a
          # blocking error dialog cannot hang the job.
          $p = Start-Process -FilePath $exe -ArgumentList "--version" -NoNewWindow `
            -RedirectStandardOutput $out -PassThru
          $null = $p.Handle  # needed so ExitCode is available after exit
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw "Smoke test timed out" }
          $text = (Get-Content $out -Raw)
          Write-Host "Output: $text"
          if ($p.ExitCode -ne 0) { throw "Exit code $($p.ExitCode)" }
          if ($text -notmatch [regex]::Escape("${{ steps.version.outputs.version }}")) {
            throw "Version string not found in output"
          }
          if (-not (Test-Path "dist/vinyl-label-printer/_internal/poppler/bin/pdftoppm.exe")) {
            throw "Poppler not bundled"
          }

      - name: Verify app icon
        run: |
          python packaging/icons/check_exe_icon.py dist/vinyl-label-printer/vinyl-label-printer.exe
          if ($LASTEXITCODE -ne 0) { throw "App icon check failed" }
          if (-not (Test-Path "dist/vinyl-label-printer/_internal/icons/vinyl-label-printer.png")) {
            throw "Window icon PNG not bundled"
          }

      - uses: actions/upload-artifact@v6
        with:
          name: vinyl-label-printer-${{ steps.version.outputs.version }}-windows
          path: dist/vinyl-label-printer
          if-no-files-found: error

      - name: Build installer (Inno Setup)
        id: setup
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (Test-Path $iscc) {
            Write-Host "Using preinstalled Inno Setup"
          } else {
            choco install innosetup --version $env:INNOSETUP_VERSION -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw "choco install innosetup failed" }
          }
          # Not quiet: the log shows "Compiler engine version" (ISCC.exe itself
          # carries no version resource) and every file packed into the setup.
          & $iscc "/DAppVersion=${{ steps.version.outputs.version }}" `
            packaging/windows/vinyl-label-printer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }
          $file = "VinylLabelPrinterSetup-${{ steps.version.outputs.version }}.exe"
          if (-not (Test-Path "dist/$file")) { throw "dist/$file not found" }
          "file=$file" >> $env:GITHUB_OUTPUT

      - name: Install test (silent install, upgrade, --version, uninstall)
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $setup = (Resolve-Path "dist/${{ steps.setup.outputs.file }}").Path
          $appDir = Join-Path $env:LOCALAPPDATA "Programs\Vinyl Label Printer"
          $exe = Join-Path $appDir "vinyl-label-printer.exe"
          $shortcut = Join-Path $env:APPDATA `
            "Microsoft\Windows\Start Menu\Programs\Vinyl Label Printer\Vinyl Label Printer.lnk"
          $uninstKey = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\" +
            "{BFCF8A94-71A8-4613-99F2-B65DB1EA679E}_is1"
          $dataFile = Join-Path $env:APPDATA "vinyl-label-printer\settings.json"

          # Runs a process with a timeout so a hanging dialog cannot block the job.
          function Invoke-WithTimeout($file, $arguments, $seconds, $log) {
            $p = Start-Process -FilePath $file -ArgumentList $arguments -PassThru
            $null = $p.Handle  # needed so ExitCode is available after exit
            if (-not $p.WaitForExit($seconds * 1000)) {
              $p.Kill(); throw "$file timed out after $seconds s"
            }
            if ($p.ExitCode -ne 0) {
              if ($log -and (Test-Path $log)) { Get-Content $log -Tail 40 }
              throw "$file exited with code $($p.ExitCode)"
            }
          }
          $silent = @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/CURRENTUSER", "/NORESTART")

          # Fresh install, then the same setup again over it (upgrade path:
          # same AppId, files replaced, still one uninstall entry).
          foreach ($run in 1, 2) {
            $log = Join-Path $env:RUNNER_TEMP "setup-$run.log"
            Invoke-WithTimeout $setup ($silent + "/LOG=`"$log`"") 300 $log
            Write-Host "Install run $run finished"
          }
          if (-not (Test-Path $exe)) { throw "Installed exe not found: $exe" }
          if (-not (Test-Path $shortcut)) { throw "Start Menu shortcut not found: $shortcut" }
          if (Test-Path (Join-Path $appDir "unins001.exe")) { throw "Second uninstaller: upgrade created a new installation" }
          $entry = Get-ItemProperty $uninstKey
          Write-Host "Uninstall entry: $($entry.DisplayName) $($entry.DisplayVersion)"
          if ($entry.DisplayVersion -ne $version) { throw "Unexpected DisplayVersion" }

          # --version of the installed exe (same method as the smoke test)
          $out = Join-Path $env:RUNNER_TEMP "installed-version.txt"
          $p = Start-Process -FilePath $exe -ArgumentList "--version" -NoNewWindow `
            -RedirectStandardOutput $out -PassThru
          $null = $p.Handle
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw "--version timed out" }
          $text = (Get-Content $out -Raw)
          Write-Host "Output: $text"
          if ($p.ExitCode -ne 0) { throw "Exit code $($p.ExitCode)" }
          if ($text -notmatch [regex]::Escape($version)) { throw "Version string not found" }

          # User data must survive the uninstall.
          New-Item -ItemType Directory -Force -Path (Split-Path $dataFile) | Out-Null
          Set-Content -Path $dataFile -Value "{}"

          # The uninstaller restarts itself from %TEMP% and returns at once, so
          # wait for the program folder to disappear.
          $log = Join-Path $env:RUNNER_TEMP "uninstall.log"
          Invoke-WithTimeout (Join-Path $appDir "unins000.exe") `
            @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/LOG=`"$log`"") 120 $log
          $deadline = (Get-Date).AddSeconds(120)
          while ((Test-Path $appDir) -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 2 }
          if (Test-Path $appDir) {
            Get-ChildItem -Recurse $appDir | Select-Object -First 20 | ForEach-Object { $_.FullName }
            throw "Program folder still exists after uninstall: $appDir"
          }
          if (Test-Path $shortcut) { throw "Start Menu shortcut still exists after uninstall" }
          if (Test-Path $uninstKey) { throw "Uninstall entry still exists after uninstall" }
          if (-not (Test-Path $dataFile)) { throw "User data was deleted by the uninstaller" }
          Write-Host "Uninstall OK: program folder, shortcut and uninstall entry removed, user data kept"

      - uses: actions/upload-artifact@v6
        with:
          name: vinyl-label-printer-${{ steps.version.outputs.version }}-setup
          path: dist/${{ steps.setup.outputs.file }}
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Build on Ubuntu 22.04 so the bundle links against glibc 2.35 and runs on
    # Linux Mint 21 (22.04 base) and 22 (24.04 base).
    container: ubuntu:22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Install system packages
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          # binutils: objdump for PyInstaller's dependency analysis.
          # libpython3.10: shared Python library that PyInstaller bundles.
          # Qt runtime libraries: needed for the --version smoke test and so
          # PyInstaller can resolve (and bundle) the xcb/wayland dependencies of
          # the Qt platform plugins. libGL/libEGL are taken from the target system.
          apt-get install -y --no-install-recommends \
            ca-certificates git binutils \
            python3 python3-pip python3-venv libpython3.10 \
            libegl1 libgl1 libopengl0 libglib2.0-0 libfontconfig1 libfreetype6 libdbus-1-3 \
            libxkbcommon0 libxkbcommon-x11-0 libx11-xcb1 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1 \
            libxcb-util1 libwayland-client0 libwayland-cursor0 libwayland-egl1

      - uses: actions/checkout@v5

      - name: Read version
        id: version
        run: |
          version=$(python3 -c "import runpy; print(runpy.run_path('vinyl-label-printer/__version__.py')['__version__'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version"

      - name: Install dependencies
        run: |
          python3 -m venv /opt/venv
          /opt/venv/bin/pip install --upgrade pip
          /opt/venv/bin/pip install -r vinyl-label-printer/requirements.txt pyinstaller

      - name: Build with PyInstaller
        run: /opt/venv/bin/pyinstaller --noconfirm --clean "$SPEC_FILE"

      - name: Smoke test (--version)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          out=$(dist/vinyl-label-printer/vinyl-label-printer --version)
          echo "Output: $out"
          echo "$out" | grep -F "${{ steps.version.outputs.version }}"
          test -f dist/vinyl-label-printer/_internal/icons/vinyl-label-printer.png
          # The committed window icon is the 256 px hicolor PNG (build_icons.py).
          cmp vinyl-label-printer/icons/vinyl-label-printer.png \
            packaging/icons/hicolor/256x256/apps/vinyl-label-printer.png

      - name: Install fpm ${{ env.FPM_VERSION }}
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get install -y --no-install-recommends ruby
          gem install --no-document fpm -v "$FPM_VERSION"
          fpm --version

      - name: Build .deb
        id: deb
        run: |
          PYTHON=/opt/venv/bin/python packaging/linux/build_deb.sh dist
          echo "file=vinyl-label-printer_${{ steps.version.outputs.version }}_amd64.deb" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v6
        with:
          name: vinyl-label-printer-${{ steps.version.outputs.version }}-deb
          path: dist/${{ steps.deb.outputs.file }}
          if-no-files-found: error

      - name: Create tarball
        id: tarball
        run: |
          name="vinyl-label-printer-${{ steps.version.outputs.version }}-linux-x86_64"
          tar -czf "$name.tar.gz" -C dist vinyl-label-printer
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.tarball.outputs.name }}
          path: ${{ steps.tarball.outputs.name }}.tar.gz
          if-no-files-found: error

  deb-install-test:
    needs: linux
    name: deb-install-test (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Linux Mint 21 is based on Ubuntu 22.04, Linux Mint 22 on Ubuntu 24.04.
        image: ["ubuntu:22.04", "ubuntu:24.04"]
    # Fresh container: nothing but the .deb and its Depends gets installed
    # before the checks below.
    container: ${{ matrix.image }}
    env:
      DEBIAN_FRONTEND: noninteractive
      DEB_FILE: vinyl-label-printer_${{ needs.linux.outputs.version }}_amd64.deb
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v6
        with:
          name: vinyl-label-printer-${{ needs.linux.outputs.version }}-deb

      - name: Install the .deb
        run: |
          apt-get update
          # Without Recommends, so only the package's Depends can satisfy the
          # bundle's libraries.
          apt-get install -y --no-install-recommends "./$DEB_FILE"

      - name: Run --version from /usr/bin
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          test "$(command -v vinyl-label-printer)" = /usr/bin/vinyl-label-printer
          out=$(vinyl-label-printer --version)
          echo "Output: $out"
          echo "$out" | grep -F "${{ needs.linux.outputs.version }}"

      - name: Check that all bundled libraries resolve
        run: packaging/linux/check_bundle_libs.sh /opt/vinyl-label-printer

      - name: Validate the .desktop file
        run: |
          apt-get install -y --no-install-recommends desktop-file-utils
          desktop-file-validate /usr/share/applications/vinyl-label-printer.desktop

      - name: Start on X11 (Xvfb) and check StartupWMClass
        env:
          VERSION: ${{ needs.linux.outputs.version }}
        run: |
          apt-get install -y --no-install-recommends \
            xvfb x11-utils libgl1-mesa-dri fonts-dejavu-core
          expected=$(sed -n 's/^StartupWMClass=//p' \
            /usr/share/applications/vinyl-label-printer.desktop)
          Xvfb :99 -screen 0 1400x1000x24 & xvfb=$!
          export DISPLAY=:99
          for _ in $(seq 1 20); do xdpyinfo >/dev/null 2>&1 && break; sleep 0.5; done
          QT_QPA_PLATFORM=xcb vinyl-label-printer & app=$!
          # The main window title is "<app name> v<version>" in every language.
          for _ in $(seq 1 60); do
            id=$(xwininfo -root -tree \
              | awk -v t=" v$VERSION\"" 'index($0, t) && !id {id = $1} END {print id}')
            [ -n "$id" ] && break
            kill -0 "$app"   # fails the step if the app has exited
            sleep 1
          done
          test -n "$id"
          # Window icon set from icons/vinyl-label-printer.png (256 px)
          # shellcheck disable=SC2016  # xprop format, not shell variables
          xprop -id "$id" -len 16 -f _NET_WM_ICON 32cc ' = $0 x $1' _NET_WM_ICON | tee icon.txt
          grep -F "= 256 x 256" icon.txt
          xprop -id "$id" WM_CLASS | tee wm_class.txt
          grep -F "\"$expected\"" wm_class.txt
          kill "$app" "$xvfb"

      - name: Remove the package (user data is kept)
        run: |
          mkdir -p "$HOME/.config/vinyl-label-printer"
          echo '{}' > "$HOME/.config/vinyl-label-printer/settings.json"
          apt-get remove -y vinyl-label-printer
          test ! -e /usr/bin/vinyl-label-printer
          test ! -e /opt/vinyl-label-printer
          test -f "$HOME/.config/vinyl-label-printer/settings.json"

  release:
    # Only for version tags; branch pushes and pull requests stop after the tests.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux, deb-install-test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The only job that may write: creating the release and uploading its assets.
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.linux.outputs.version }}
    steps:
      - name: Check the tag against __version__.py
        run: |
          # "v1.2.3" -> "1.2.3" (older tags look like "v.0.2.0"), and a
          # pre-release suffix is cut off: "v1.2.3-rc.1" -> "1.2.3".
          tag_version="${TAG#v}"
          tag_version="${tag_version#.}"
          tag_version="${tag_version%%-*}"
          echo "Tag $TAG -> $tag_version, __version__.py: $VERSION"
          if [ "$tag_version" != "$VERSION" ]; then
            echo "::error::Tag $TAG does not match __version__.py ($VERSION)"
            exit 1
          fi

      - uses: actions/download-artifact@v8
        with:
          name: vinyl-label-printer-${{ env.VERSION }}-deb
          path: release

      - uses: actions/download-artifact@v8
        with:
          name: vinyl-label-printer-${{ env.VERSION }}-setup
          path: release

      - name: Create SHA256SUMS.txt
        working-directory: release
        run: |
          sha256sum "vinyl-label-printer_${VERSION}_amd64.deb" \
            "VinylLabelPrinterSetup-${VERSION}.exe" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create or update the GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.TAG }}
          name: Vinyl Label Printer ${{ env.TAG }}
          # Tags with a suffix (v1.0.0-rc.1) become pre-releases. The in-app
          # update check (modules/version_checker.py) and install.sh /
          # install.ps1 only accept plain vX.Y.Z tags, so a pre-release is never
          # offered as an update. Keep it that way.
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/vinyl-label-printer_${{ env.VERSION }}_amd64.deb
            release/VinylLabelPrinterSetup-${{ env.VERSION }}.exe
            release/SHA256SUMS.txt
